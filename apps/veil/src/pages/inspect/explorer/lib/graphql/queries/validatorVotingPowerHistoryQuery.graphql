query ValidatorVotingPowerHistory(
    $validatorId: String!,
    $startTime: DateTime,
    $endTime: DateTime,
    $limit: Int
) {
    validatorVotingPowerHistory(
        validatorId: $validatorId,
        startTime: $startTime,
        endTime: $endTime,
        limit: $limit
    ) {
        validatorIdentityKey
        votingPower
        blockHeight
        timestamp
    }
}
